<script>

const skills=[
{id:'m',title:'جمع المذكر السالم',symbol:'ونَ',subtitle:'المفرد يبقى… ونضيف إليه',rule:'ما دلّ على ثلاثة فأكثر، بزيادة واو ونون في حالة الرفع، أو ياء ونون في حالتي النصب والجر، مع بقاء صورة المفرد سالمة من التغيير. نون الجمع مفتوحة.',formula:'معلّم ← معلّمونَ / معلّمينَ',examples:[['معلّم','معلّمونَ'],['عامل','عاملونَ'],['صانع','صانعينَ']],tip:'حضرَ المعلّمونَ، ورأيتُ المعلّمينَ، وسلّمتُ على المعلّمينَ. نبحث عن المفرد أيضًا؛ فكلمة «عيون» جمع تكسير ومفردها «عين».'},
{id:'f',title:'جمع المؤنث السالم',symbol:'ات',subtitle:'ألف وتاء… ومعرفة جديدة',rule:'ما دلّ على ثلاث فأكثر، بزيادة ألف وتاء على مفرده مع بقاء حروفه الأصلية سالمة. تُحذف التاء المربوطة من المفرد عند وجودها قبل إضافة الألف والتاء.',formula:'معلّمة ← معلّمات',examples:[['مرابطة','مرابطات'],['طبيبة','طبيبات'],['مهندسة','مهندسات']],tip:'نكتب: مرابطة ← مرابطات، ولا نكتب مرابطةات. لا تكفي النهاية للحكم؛ فكلمة «أبيات» جمع تكسير ومفردها «بيت».'},
{id:'b',title:'جمع التكسير',symbol:'كُتُب',subtitle:'تتغيّر الصورة… ويبقى المعنى',rule:'ما دلّ على ثلاثة فأكثر، وتتغيّر صورة مفرده عند الجمع. قد تتغيّر الحركات أو تُزاد حروف أو تُحذف حروف.',formula:'كتاب ← كُتُب',examples:[['قلم','أقلام'],['باب','أبواب'],['رجل','رجال']],tip:'قارن بين المفرد والجمع: كتاب ← كُتُب، وشجرة ← أشجار. لا نعتمد على إضافة نهاية ثابتة لجميع الكلمات.'}
];
const questions=[
['m','ما نوع الجمع في كلمة «معلّمونَ»؟',['جمع المذكر السالم','جمع المؤنث السالم','جمع التكسير'],0,'مفردها معلّم؛ أضفنا واوًا ونونًا وبقيت صورة المفرد سالمة.'],
['f','اختر الجمع الصحيح لكلمة «مرابطة».',['مرابطةات','مرابطات','مرابطون'],1,'نحذف التاء المربوطة ثم نضيف ألفًا وتاءً: مرابطة ← مرابطات.'],
['b','ما نوع الجمع في كلمة «كُتُب»؟',['جمع المؤنث السالم','جمع المذكر السالم','جمع التكسير'],2,'مفردها كتاب، وقد تغيّرت صورته بحذف الألف وتغيّر الحركات.'],
['m','أكمل: حضرَ … إلى المدرسة.',['المعلّمينَ','المعلّمونَ','المعلّمَ'],1,'المعلّمونَ فاعل مرفوع بالواو لأنه جمع مذكر سالم.'],
['f','أيّ مجموعة كلّها جمع مؤنث سالم؟',['أقلام، أبواب، كتب','عاملون، صانعون، معلّمون','طبيبات، مهندسات، مرابطات'],2,'جمعنا المفرد بزيادة ألف وتاء مع حذف التاء المربوطة.'],
['b','ما مفرد كلمة «أبواب»؟',['باب','بوّاب','بابات'],0,'باب ← أبواب؛ تغيّرت صورة المفرد، فهو جمع تكسير.'],
['m','أكمل: سلّمتُ على … .',['المهندسونَ','المهندسينَ','المهندساتُ'],1,'بعد حرف الجر «على» نستخدم الياء والنون في جمع المذكر السالم.'],
['m','أيّ كلمة جمع مذكر سالم؟',['عيون','غصون','صائمون'],2,'صائم ← صائمون. أمّا عيون وغصون فمفرداهما عين وغصن، وهما جمعا تكسير.'],
['f','ما مفرد كلمة «مهندسات»؟',['مهندسة','مهندس','هندسة'],0,'نعيد التاء المربوطة: مهندسات ← مهندسة.'],
['f','ما الحرفان اللذان نزيدهما في جمع المؤنث السالم؟',['واو ونون','ألف وتاء','ياء ونون'],1,'مثل طبيبة ← طبيبات؛ نحذف التاء المربوطة ثم نضيف ألفًا وتاءً.'],
['b','أيّ كلمة جمع تكسير رغم انتهائها بـ«ات»؟',['معلّمات','طبيبات','أبيات'],2,'مفرد أبيات هو بيت؛ تغيّرت صورة المفرد.'],
['b','اختر الجمع الصحيح لكلمة «شجرة».',['أشجار','شجرون','شجرةات'],0,'شجرة ← أشجار؛ تغيّرت صورة المفرد عند الجمع.']
].map((q,id)=>({id,skill:q[0],prompt:q[1],options:q[2],answer:q[3],explanation:q[4]}));
const $=s=>document.querySelector(s), main=$('#main'), modal=$('#activity'), content=$('#activity-content'), key='pluralquest.rebuilt.v1';
const fresh=()=>({attempts:[],lessons:[],diagnostic:false,sessions:0});
let state=fresh(),storageOK=true,session=null,lastFocus=null;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.attempts)){state={attempts:saved.attempts.filter(a=>a&&Number.isInteger(a.id)&&questions[a.id]&&typeof a.correct==='boolean'&&typeof a.hinted==='boolean').slice(-2000),lessons:Array.isArray(saved.lessons)?saved.lessons.filter(id=>skills.some(s=>s.id===id)):[],diagnostic:saved.diagnostic===true,sessions:Number.isInteger(saved.sessions)&&saved.sessions>=0?saved.sessions:0};}}catch{storageOK=false;}
const ar=n=>Number(n).toLocaleString('ar-u-nu-arab');
function persist(){try{localStorage.setItem(key,JSON.stringify(state));}catch{storageOK=false;}}
function stat(id){const all=state.attempts.filter(a=>questions[a.id].skill===id), recent=all.slice(-5);return {count:all.length,correct:all.filter(a=>a.correct&&!a.hinted).length,mastery:recent.filter(a=>a.correct&&!a.hinted).length*20};}
function points(){return state.attempts.reduce((sum,a)=>sum+(a.correct?(a.hinted?5:10):0),0);}
function recommended(){return [...skills].sort((a,b)=>stat(a.id).mastery-stat(b.id).mastery||stat(a.id).count-stat(b.id).count)[0];}
function overview(){return `<section class="overview" aria-label="ملخص التقدّم"><div class="intro"><b>✧ رحلتك في لمحة</b><span>كل محاولة تصنع فرقًا</span></div><div><b>${ar(state.attempts.length)}</b><span>سؤالًا أجبت عنه</span></div><div><b>${ar(skills.filter(s=>stat(s.id).mastery>=80).length)} / ٣</b><span>مهارات متقَنة</span></div><div><span>مؤشّر الإتقان العام</span><b>${ar(Math.round(skills.reduce((n,s)=>n+stat(s.id).mastery,0)/3))}٪</b><div class="track"><i style="width:${skills.reduce((n,s)=>n+stat(s.id).mastery,0)/3}%"></i></div></div></section>`;}
function card(s,i,guide=false){return `<article class="card" data-kind="${s.id}"><div class="card-top"><span class="symbol">${s.symbol}</span><span class="number">المحطّة ${ar(i+1)}</span></div><small>${s.subtitle}</small><h3>${s.title}</h3>${guide?`<p class="rule">${s.rule}</p><div class="examples">${s.examples.map(([a,b])=>`<div><span>${a}</span><b>← ${b}</b></div>`).join('')}</div><p class="tip">${s.tip}</p>`:`<div class="formula">${s.formula}</div><small>مؤشّر الإتقان · ${ar(stat(s.id).mastery)}٪</small><div class="track"><i style="width:${stat(s.id).mastery}% ;background:var(--accent)"></i></div>`}<div class="card-actions">${guide?'':`<button class="button" data-action="lesson" data-skill="${s.id}">اكتشف القاعدة <span>←</span></button>`}<button class="${guide?'button':'text-button'}" data-action="practice" data-skill="${s.id}">تدرّب ${guide?'على هذه المهارة':'↗'}</button></div></article>`;}
const art=`<div class="art" aria-hidden="true"><div class="orbit"></div><span class="spark">✦</span><svg class="book" viewBox="0 0 300 210"><path d="M20 44Q85 14 150 45Q215 14 280 44L280 184Q215 161 150 191Q85 161 20 184Z" fill="#8860c3"/><path d="M27 30Q90 9 150 41V178Q88 149 27 172Z" fill="#fffdf5"/><path d="M150 41Q211 9 273 30V172Q211 149 150 178Z" fill="#f3eafc"/><path d="M150 42V176" stroke="#d0b6df" stroke-width="3"/><path d="M45 56Q85 44 123 56M45 69Q85 57 123 69M177 56Q215 44 254 56M177 69Q215 57 254 69" fill="none" stroke="#d9c6e6" stroke-width="5" stroke-linecap="round"/><ellipse cx="114" cy="105" rx="6" ry="9" fill="#513b69"/><ellipse cx="187" cy="105" rx="6" ry="9" fill="#513b69"/><path d="M133 125Q150 142 168 125" fill="none" stroke="#513b69" stroke-width="4" stroke-linecap="round"/><ellipse cx="100" cy="121" rx="12" ry="5" fill="#e8b5c3"/><ellipse cx="202" cy="121" rx="12" ry="5" fill="#e8b5c3"/></svg><span class="word">معلّمون<small>معًا نتعلّم</small></span><span class="word two">معلّمات <small>ومعًا نكتشف</small></span></div>`;
function render(){const route=['journey','guide','report'].includes(location.hash.slice(1))?location.hash.slice(1):'journey';document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
if(route==='journey')main.innerHTML=`<div class="welcome"><div><span class="eyebrow">أهلًا بك في عالم اللغة العربية</span><h1>مرحبًا، أيّها المستكشف! <span style="color:#c39a57">✦</span></h1><p>خطوة صغيرة اليوم، ومعرفة أكبر كل يوم.</p></div><div class="points">✦ <b>${ar(points())}</b> نقطة</div></div><section class="hero"><div class="hero-copy"><span class="tag">● اللغة العربية، بطريقة تحبّها</span><h2>كلمة واحدة،<br>وعالم من <span>الجموع.</span></h2><p>تعلّم، جرّب، واكتشف الفرق بين أنواع الجموع.<br>رحلة تبدأ من مستواك، وتكبر مع كل محاولة.</p><button class="button" data-action="${state.diagnostic?'adaptive':'diagnostic'}">${state.diagnostic?'واصل مغامرتك':'لنكتشف نقطة البداية'} <span>←</span></button><small>✧ ${state.diagnostic?'تدريب موجّه نحو المهارة التي تحتاج إلى اهتمامك':'٦ أسئلة قصيرة · دون وقت محدّد'}</small></div>${art}</section>${overview()}<div class="section-title"><h2>محطّات رحلتك</h2><p>تعلّم القاعدة، ثم جرّب بنفسك</p></div><div class="cards">${skills.map((s,i)=>card(s,i)).join('')}</div><aside class="note"><span>✧</span><div><h3>لكل مستكشف طريقه</h3><p>نقترح التدريب على المهارة الأقل إتقانًا. والخطأ فرصة لنفهم أكثر، ونحاول من جديد.</p></div></aside>`;
if(route==='guide')main.innerHTML=`<div class="guide-intro"><span class="eyebrow">نلاحظ، نقارن، ونستنتج</span><h1>دليل الجموع</h1><p>الجمع يدلّ على ثلاثة فأكثر. لنتعرّف إلى أنواعه الثلاثة من القاعدة والأمثلة.</p></div><div class="cards guide">${skills.map((s,i)=>card(s,i,true)).join('')}</div><aside class="note"><span>✦</span><div><h3>اسأل عن المفرد أولًا</h3><p>لا يكفي آخر الكلمة لمعرفة نوع الجمع: «عيون» و«أبيات» جمعا تكسير، ومفرداهما «عين» و«بيت».</p></div></aside>`;
if(route==='report')main.innerHTML=`<div class="guide-intro"><span class="eyebrow">كل خطوة تستحقّ أن تراها</span><h1>لوحة التقدّم</h1><p>هنا ترى ما تعلّمته، وما يمكنك التدرب عليه بعد ذلك.</p></div>${overview()}<section class="report">${!state.attempts.length?'<div class="empty"><h2>رحلتك تنتظر أول خطوة</h2><p>أجب عن أسئلة البداية لنساعدك في اختيار التدريب المناسب.</p><button class="button" data-action="diagnostic">ابدأ التشخيص ←</button></div>':''}<div class="table-wrap"><table><caption>مهاراتي الثلاث</caption><thead><tr><th scope="col">المهارة</th><th scope="col">المحاولات</th><th scope="col">صحيحة دون تلميح</th><th scope="col">مؤشّر الإتقان</th><th scope="col">خطوتي التالية</th></tr></thead><tbody>${skills.map(s=>{const t=stat(s.id);return `<tr><th scope="row">${s.title}</th><td>${ar(t.count)}</td><td>${ar(t.correct)}</td><td>${ar(t.mastery)}٪ ${t.mastery>=80?'✦ متقَن':''}</td><td><button class="text-button" data-action="practice" data-skill="${s.id}">تدرّب ←</button></td></tr>`;}).join('')}</tbody></table></div><p class="report-note">لكل إجابة صحيحة دون تلميح من آخر خمس محاولات في المهارة ٢٠٪. تبدأ شارة الإتقان من ٨٠٪. هذا مؤشّر للتعلّم وليس علامة مدرسية.</p><div class="tools"><button class="button secondary" data-action="export">↓ تنزيل تقرير التقدّم</button><button class="text-button" data-action="reset">إعادة ضبط التقدّم</button></div></section>`;
if(!storageOK)main.insertAdjacentHTML('beforeend','<p class="status" role="status">تعذّر حفظ التقدّم في هذا المتصفح. يمكنك متابعة التدريب وتنزيل تقريرك قبل إغلاق الصفحة.</p>');}
function open(html){lastFocus=document.activeElement;content.innerHTML=`<div class="modal-top"><span>مغامرة الجموع</span><button class="close" data-action="close" aria-label="إغلاق النشاط">×</button></div>${html}`;if(!modal.open)modal.showModal();else content.querySelector('button')?.focus();}
function lesson(id){const s=skills.find(s=>s.id===id);if(!s)return;open(`<h2 id="activity-title">${s.title}</h2><p class="rule">${s.rule}</p><div class="card" data-kind="${s.id}"><div class="examples">${s.examples.map(([a,b])=>`<div><span>${a}</span><b>← ${b}</b></div>`).join('')}</div><p class="tip">${s.tip}</p></div><div class="actions" style="margin-top:20px"><button class="button" data-action="learned" data-skill="${id}">فهمت، لنجرّب ←</button></div>`);}
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function start(mode,id){const pool=mode==='diagnostic'?questions.slice(0,6):shuffle(questions.filter(q=>q.skill===(id||recommended().id)));session={mode,pool,index:0,selected:null,hinted:false,answered:false,results:[]};showQuestion();}
function showQuestion(){if(session.index>=session.pool.length)return finish();session.selected=null;session.hinted=false;session.answered=false;const q=session.pool[session.index];open(`<div class="eyebrow">${session.mode==='diagnostic'?'اكتشاف نقطة البداية':'تدريب على '+skills.find(s=>s.id===q.skill).title} · السؤال ${ar(session.index+1)} من ${ar(session.pool.length)}</div><div class="track"><i style="width:${session.index/session.pool.length*100}%"></i></div><h2 id="activity-title">${q.prompt}</h2><div class="options" role="group" aria-label="خيارات الإجابة">${q.options.map((o,i)=>`<button class="option" data-action="select" data-index="${i}" aria-pressed="false">${['أ','ب','ج'][i]} · ${o}</button>`).join('')}</div><div id="hint" class="hint" hidden></div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="button" data-action="check" disabled>تحقّق من إجابتي ✓</button><button class="button" data-action="next" hidden>السؤال التالي ←</button>${session.mode==='diagnostic'?'':'<button class="text-button" data-action="hint">أحتاج تلميحًا ✧</button>'}</div>`);}
function check(){if(!session||session.answered||session.selected===null)return;const q=session.pool[session.index];const entry={id:q.id,correct:session.selected===q.answer,hinted:session.hinted};session.results.push(entry);state.attempts.push(entry);session.answered=true;persist();render();content.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===q.answer);b.classList.toggle('wrong',i===session.selected&&!entry.correct);});$('#feedback').innerHTML=`<div class="feedback"><b>${entry.correct?session.hinted?'أحسنت استخدام التلميح! +٥ نقاط':'أحسنت، إجابة صحيحة! +١٠ نقاط':'محاولة مفيدة، لنتعلّم منها.'}</b><p>${q.explanation}</p></div>`;content.querySelector('[data-action=check]').hidden=true;const next=content.querySelector('[data-action=next]');next.hidden=false;if(session.index===session.pool.length-1)next.textContent='شاهد حصيلة الجولة ←';const hint=content.querySelector('[data-action=hint]');if(hint)hint.disabled=true;next.focus();}
function finish(){const wins=session.results.filter(a=>a.correct&&!a.hinted).length,size=session.pool.length;if(session.mode==='diagnostic')state.diagnostic=true;state.sessions++;persist();session=null;render();open(`<div class="summary"><span class="medal">✦</span><h2 id="activity-title">خطوة جديدة تستحقّ الفخر!</h2><p>أجبت عن <b>${ar(wins)} من ${ar(size)}</b> بشكل صحيح دون تلميح.<br>خطوتك المقترحة: ${recommended().title}.</p><div class="actions"><button class="button" data-action="adaptive">واصل المغامرة ←</button><button class="button secondary" data-action="report">شاهد تقدّمي</button></div></div>`);}
function exportReport(){const data={application:'PluralQuest',exportedAt:new Date().toISOString(),points:points(),sessions:state.sessions,diagnosticDone:state.diagnostic,skills:skills.map(s=>({skill:s.title,...stat(s.id)})),attempts:state.attempts};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='PluralQuest-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.skill;
if(a==='close')modal.close();
if(a==='lesson')lesson(id);
if(a==='learned'){if(!state.lessons.includes(id))state.lessons.push(id);persist();start('practice',id);}
if(a==='practice')start('practice',id);
if(a==='adaptive')start('practice');
if(a==='diagnostic')start('diagnostic');
if(a==='select'&&session&&!session.answered){session.selected=Number(b.dataset.index);content.querySelectorAll('.option').forEach((el,i)=>el.setAttribute('aria-pressed',String(i===session.selected)));content.querySelector('[data-action=check]').disabled=false;}
if(a==='check')check();
if(a==='next'&&session?.answered){session.index++;showQuestion();}
if(a==='hint'&&session&&!session.answered){session.hinted=true;$('#hint').textContent=skills.find(s=>s.id===session.pool[session.index].skill).rule;$('#hint').hidden=false;b.disabled=true;}
if(a==='report'){modal.close();location.hash='report';}
if(a==='export')exportReport();
if(a==='reset')open('<h2 id="activity-title">هل تريد بداية جديدة؟</h2><p>سيُحذف التقدّم المحفوظ في هذا المتصفح. يمكنك تنزيل تقريرك أولًا.</p><div class="actions" style="margin-top:20px"><button class="button secondary" data-action="close">احتفظ بتقدّمي</button><button class="button" data-action="confirm-reset">نعم، ابدأ من جديد</button></div>');
if(a==='confirm-reset'){state=fresh();persist();modal.close();render();}
});
modal.addEventListener('close',()=>{session=null;if(lastFocus?.isConnected)lastFocus.focus();else main.focus();});
window.addEventListener('hashchange',()=>{if(modal.open)modal.close();render();main.focus();window.scrollTo(0,0);});
render();
</script></body></html>
